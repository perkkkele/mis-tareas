<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tareas</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f6f8;
    --border: #e3e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-soft: #e8f0fe;
    --ok: #1f9d55;
    --ok-soft: #e6f6ec;
    --done: #9aa1ad;
    --danger: #d93838;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; border: 0; cursor: pointer; background: transparent; color: inherit; }

  header { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 12px 6px; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  #count { color: var(--muted); font-size: 12px; }

  form#form { display: flex; gap: 6px; padding: 0 12px 8px; }
  #nueva {
    flex: 1; min-width: 0; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--surface);
  }
  #nueva:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }
  #anadir { background: var(--accent); color: #fff; padding: 0 12px; font-weight: 600; border-radius: 8px; }
  #anadir:hover { filter: brightness(1.08); }

  .filtros { display: flex; gap: 4px; padding: 0 12px 6px; }
  .filtros button { color: var(--muted); padding: 3px 9px; border-radius: 999px; font-size: 12px; }
  .filtros button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  #lista { list-style: none; margin: 0; padding: 0 6px 6px; flex: 1; overflow-y: auto; }

  /* Fila de tarea */
  .tarea { border-radius: 8px; }
  .tarea.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: var(--ok-soft); } 100% { background: transparent; } }
  .fila { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 8px; }
  .fila:hover { background: var(--surface); }
  .expandir {
    width: 18px; height: 18px; flex: none; border-radius: 4px;
    color: var(--muted); font-size: 12px; line-height: 18px; text-align: center;
    transition: transform .15s;
  }
  .expandir:hover { background: var(--border); color: var(--text); }
  .expandir[aria-expanded="true"] { transform: rotate(90deg); }
  .sin-subs .expandir { opacity: .35; }
  .fila:hover .expandir { opacity: 1; }

  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex: none; cursor: pointer; margin: 0; }
  .cuerpo { flex: 1; min-width: 0; }
  .texto { display: block; overflow-wrap: anywhere; cursor: text; }
  .hecha > .fila .texto, .sub.hecha .texto { color: var(--done); text-decoration: line-through; }
  .barra { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s; }
  .hecha .barra i { background: var(--ok); }
  .contador {
    flex: none; font-size: 11px; color: var(--muted);
    background: var(--surface); border-radius: 999px; padding: 1px 7px;
  }
  .hecha .contador { color: var(--ok); background: var(--ok-soft); }

  .editar { width: 100%; font: inherit; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; }

  .borrar {
    width: 22px; height: 22px; flex: none; border-radius: 6px;
    color: var(--muted); font-size: 16px; line-height: 1; opacity: 0;
  }
  .fila:hover > .borrar, .sub:hover > .borrar, .borrar:focus { opacity: 1; }
  .borrar:hover { color: var(--danger); background: #fdecec; }
  @media (hover: none) { .borrar { opacity: 1; } .sin-subs .expandir { opacity: 1; } }

  /* Subtareas */
  .subs { list-style: none; margin: 0 0 4px 30px; padding: 0 0 0 10px; border-left: 2px solid var(--border); }
  .sub { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px; font-size: 13px; }
  .sub:hover { background: var(--surface); }
  .sub .texto { flex: 1; min-width: 0; }
  .nueva-sub { padding: 3px 4px; }
  .nueva-sub input {
    flex: 1; min-width: 0; width: 100%; font: inherit; font-size: 13px; padding: 4px 8px;
    border: 1px dashed var(--border); border-radius: 6px; background: transparent;
  }
  .nueva-sub input:focus { outline: none; border-style: solid; border-color: var(--accent); background: #fff; }

  .vacio { color: var(--muted); text-align: center; padding: 18px 10px; font-size: 13px; }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 12px 8px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  #limpiar { color: var(--muted); font-size: 12px; padding: 2px 4px; }
  #limpiar:hover { color: var(--danger); }
  #aviso { color: var(--danger); }
  #deshacer-wrap { display: none; align-items: center; gap: 6px; color: var(--text); }
  #deshacer-wrap.visible { display: flex; }
  #deshacer { color: var(--accent); font-weight: 600; font-size: 12px; padding: 2px 4px; }

  /* Iconos */
  .ico { width: 16px; height: 16px; display: block; }
  .icono-btn {
    width: 22px; height: 22px; flex: none; border-radius: 6px;
    display: grid; place-items: center;
  }
  .icono-btn:hover { background: var(--border); }
  .icono-btn.vacio { color: var(--muted); opacity: 0; }
  .fila:hover .icono-btn.vacio, .sub:hover .icono-btn.vacio, .nueva-sub .icono-btn.vacio, .icono-btn.vacio:focus { opacity: .6; }
  .hecha > .fila .icono-btn:not(.vacio), .sub.hecha .icono-btn:not(.vacio) { opacity: .45; }
  .sub .icono-btn, .nueva-sub .icono-btn { width: 20px; height: 20px; }
  .sub .ico, .nueva-sub .ico { width: 14px; height: 14px; }
  .nueva-sub { display: flex; align-items: center; gap: 6px; }
  @media (hover: none) { .icono-btn.vacio { opacity: .4; } }

  #icono-nueva {
    width: 34px; flex: none; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    display: grid; place-items: center; color: var(--muted);
  }
  #icono-nueva:hover { border-color: var(--accent); }
  #icono-nueva.elegido { background: #fff; }

  #picker {
    position: fixed; z-index: 10; display: none;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(20, 30, 50, .16);
    padding: 6px; width: 172px;
  }
  #picker.abierto { display: block; }
  #picker .rejilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #picker .opcion {
    height: 36px; border-radius: 8px; display: grid; place-items: center;
  }
  #picker .opcion:hover, #picker .opcion:focus { background: var(--surface); outline: none; }
  #picker .opcion[aria-pressed="true"] { background: var(--accent-soft); }
  #picker .opcion .ico { width: 18px; height: 18px; }
  #picker .nombre { font-size: 11px; color: var(--muted); text-align: center; height: 16px; margin-top: 4px; }
  #picker .quitar {
    width: 100%; margin-top: 4px; padding: 4px; border-radius: 6px;
    font-size: 12px; color: var(--muted);
  }
  #picker .quitar:hover { background: #fdecec; color: var(--danger); }
</style>
</head>
<body>
  <header>
    <h1>Mis tareas</h1>
    <span id="count"></span>
  </header>

  <form id="form" autocomplete="off">
    <button id="icono-nueva" type="button" title="Elegir icono" aria-label="Elegir icono para la nueva tarea"></button>
    <input id="nueva" type="text" placeholder="Nueva tarea y pulsa Enter" maxlength="200" aria-label="Nueva tarea">
    <button id="anadir" type="submit" aria-label="Añadir tarea">+</button>
  </form>

  <div class="filtros" role="group" aria-label="Filtro">
    <button data-f="todas" aria-pressed="true">Todas</button>
    <button data-f="pendientes" aria-pressed="false">Pendientes</button>
    <button data-f="hechas" aria-pressed="false">Hechas</button>
  </div>

  <ul id="lista"></ul>

  <footer>
    <span id="aviso"></span>
    <span id="deshacer-wrap"><span id="deshacer-msg"></span><button id="deshacer" type="button">Deshacer</button></span>
    <button id="limpiar" type="button">Borrar hechas</button>
  </footer>

  <div id="picker" role="dialog" aria-label="Elegir icono">
    <div class="rejilla"></div>
    <div class="nombre"></div>
    <button class="quitar" type="button">Sin icono</button>
  </div>

<script>
(function () {
  var CLAVE = 'mis-tareas-v1';
  var tareas = [];
  var filtro = 'todas';
  var foco = null;          // { tipo: 'sub', id } para recolocar el foco tras repintar
  var flashId = null;       // tarea que acaba de completarse sola
  var copiaDeshacer = null;
  var temporizador = null;
  var iconoNueva = null;    // icono elegido para la próxima tarea
  var iconoNuevaSub = {};   // icono elegido para la próxima subtarea, por tarea

  // ---------- Iconos ----------
  var ICONOS = {
    llamar:    { nombre: 'Llamar',    color: '#1f9d55', svg: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>' },
    ordenador: { nombre: 'Ordenador', color: '#4b5563', svg: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>' },
    casa:      { nombre: 'Casa',      color: '#d97706', svg: '<path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>' },
    email:     { nombre: 'Email',     color: '#2f6fed', svg: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>' },
    comprar:   { nombre: 'Comprar',   color: '#db2777', svg: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>' },
    reunion:   { nombre: 'Reunión',   color: '#7c3aed', svg: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>' },
    pagar:     { nombre: 'Pagar',     color: '#0d9488', svg: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>' },
    preguntar: { nombre: 'Preguntar', color: '#ea580c', svg: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>' }
  };
  var ICONO_VACIO = '<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><path d="M12 8.5v7M8.5 12h7"/>';

  function svg(contenido) {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + contenido + '</svg>';
  }
  function pintarIcono(boton, clave) {
    var ic = ICONOS[clave];
    boton.innerHTML = svg(ic ? ic.svg : ICONO_VACIO);
    boton.style.color = ic ? ic.color : '';
    boton.title = ic ? ic.nombre + ' · cambiar icono' : 'Poner icono';
    boton.setAttribute('aria-label', boton.title);
  }

  // ---------- Datos ----------
  function normalizar(lista) {
    if (!Array.isArray(lista)) return [];
    return lista.map(function (t) {
      return {
        id: t.id || nuevoId(),
        texto: String(t.texto || ''),
        hecha: !!t.hecha,
        creada: t.creada || Date.now(),
        abierta: !!t.abierta,
        icono: ICONOS[t.icono] ? t.icono : null,
        subtareas: Array.isArray(t.subtareas) ? t.subtareas.map(function (s) {
          return { id: s.id || nuevoId(), texto: String(s.texto || ''), hecha: !!s.hecha, icono: ICONOS[s.icono] ? s.icono : null };
        }) : []
      };
    });
  }
  function cargar() {
    try {
      var raw = localStorage.getItem(CLAVE);
      tareas = normalizar(raw ? JSON.parse(raw) : []);
      return true;
    } catch (e) { tareas = []; return false; }
  }
  function guardar() {
    var ok = true;
    try { localStorage.setItem(CLAVE, JSON.stringify(tareas)); } catch (e) { ok = false; }
    document.getElementById('aviso').textContent = ok ? '' : 'No se puede guardar en este navegador';
  }
  function nuevoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function buscar(id) { for (var i = 0; i < tareas.length; i++) if (tareas[i].id === id) return tareas[i]; return null; }

  // Regla clave: si una tarea tiene subtareas, está hecha solo cuando lo están todas.
  function sincronizar(t) {
    if (!t.subtareas.length) return;
    var antes = t.hecha;
    t.hecha = t.subtareas.every(function (s) { return s.hecha; });
    if (!antes && t.hecha) flashId = t.id;
  }

  // ---------- Deshacer ----------
  function conDeshacer(mensaje, accion) {
    copiaDeshacer = JSON.stringify(tareas);
    accion();
    var wrap = document.getElementById('deshacer-wrap');
    document.getElementById('deshacer-msg').textContent = mensaje;
    wrap.classList.add('visible');
    document.getElementById('limpiar').style.display = 'none';
    clearTimeout(temporizador);
    temporizador = setTimeout(ocultarDeshacer, 6000);
  }
  function ocultarDeshacer() {
    copiaDeshacer = null;
    document.getElementById('deshacer-wrap').classList.remove('visible');
    document.getElementById('limpiar').style.display = '';
  }
  document.getElementById('deshacer').addEventListener('click', function () {
    if (copiaDeshacer) { tareas = normalizar(JSON.parse(copiaDeshacer)); guardar(); pintar(); }
    ocultarDeshacer();
  });

  // ---------- Pintado ----------
  var lista = document.getElementById('lista');

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function pintar() {
    lista.innerHTML = '';
    var visibles = tareas.filter(function (t) {
      return filtro === 'todas' || (filtro === 'hechas' ? t.hecha : !t.hecha);
    });
    if (!visibles.length) {
      lista.appendChild(el('li', 'vacio', tareas.length ? 'Nada en este filtro' : 'Sin tareas. Escribe una arriba.'));
    }
    visibles.forEach(function (t) { lista.appendChild(pintarTarea(t)); });

    var pend = tareas.filter(function (t) { return !t.hecha; }).length;
    document.getElementById('count').textContent = pend === 1 ? '1 pendiente' : pend + ' pendientes';

    if (foco && foco.tipo === 'sub') {
      var inp = lista.querySelector('.nueva-sub input[data-id="' + foco.id + '"]');
      if (inp) inp.focus();
    }
    foco = null;
    flashId = null;
  }

  function pintarTarea(t) {
    var total = t.subtareas.length;
    var hechas = t.subtareas.filter(function (s) { return s.hecha; }).length;

    var li = el('li', 'tarea' + (t.hecha ? ' hecha' : '') + (total ? '' : ' sin-subs') + (flashId === t.id ? ' flash' : ''));
    var fila = el('div', 'fila');

    var exp = el('button', 'expandir', '›');
    exp.type = 'button';
    exp.setAttribute('aria-expanded', t.abierta ? 'true' : 'false');
    exp.title = total ? 'Ver subtareas' : 'Añadir subtareas';
    exp.setAttribute('aria-label', exp.title);
    exp.addEventListener('click', function () {
      t.abierta = !t.abierta;
      if (t.abierta && !total) foco = { tipo: 'sub', id: t.id };
      guardar(); pintar();
    });

    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = t.hecha;
    cb.setAttribute('aria-label', 'Marcar tarea como hecha');
    cb.addEventListener('change', function () {
      if (total) {
        // Marcar la tarea completa todas sus subtareas; desmarcarla las reabre.
        t.subtareas.forEach(function (s) { s.hecha = cb.checked; });
        sincronizar(t);
      } else {
        t.hecha = cb.checked;
      }
      guardar(); pintar();
    });

    var icoBtn = el('button', 'icono-btn' + (t.icono ? '' : ' vacio'));
    icoBtn.type = 'button';
    pintarIcono(icoBtn, t.icono);
    icoBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      abrirPicker(icoBtn, t.icono, function (clave) {
        t.icono = clave;
        guardar(); pintar();
      });
    });

    var cuerpo = el('div', 'cuerpo');
    var span = el('span', 'texto', t.texto);
    span.title = 'Doble clic para editar';
    span.addEventListener('dblclick', function () {
      editarEn(span, t.texto, function (v) { t.texto = v; });
    });
    cuerpo.appendChild(span);
    if (total) {
      var barra = el('div', 'barra');
      var relleno = el('i');
      relleno.style.width = Math.round(hechas / total * 100) + '%';
      barra.appendChild(relleno);
      cuerpo.appendChild(barra);
    }

    var del = el('button', 'borrar', '×');
    del.type = 'button';
    del.setAttribute('aria-label', 'Borrar tarea');
    del.addEventListener('click', function () {
      conDeshacer('Tarea borrada', function () {
        tareas = tareas.filter(function (x) { return x.id !== t.id; });
      });
      guardar(); pintar();
    });

    fila.appendChild(exp);
    fila.appendChild(cb);
    fila.appendChild(icoBtn);
    fila.appendChild(cuerpo);
    if (total) fila.appendChild(el('span', 'contador', hechas + '/' + total));
    fila.appendChild(del);
    li.appendChild(fila);

    if (t.abierta) li.appendChild(pintarSubtareas(t));
    return li;
  }

  function pintarSubtareas(t) {
    var ul = el('ul', 'subs');
    t.subtareas.forEach(function (s) {
      var li = el('li', 'sub' + (s.hecha ? ' hecha' : ''));
      var cb = el('input');
      cb.type = 'checkbox';
      cb.checked = s.hecha;
      cb.setAttribute('aria-label', 'Marcar subtarea como hecha');
      cb.addEventListener('change', function () {
        s.hecha = cb.checked;
        sincronizar(t);
        guardar(); pintar();
      });
      var icoBtn = el('button', 'icono-btn' + (s.icono ? '' : ' vacio'));
      icoBtn.type = 'button';
      pintarIcono(icoBtn, s.icono);
      icoBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        abrirPicker(icoBtn, s.icono, function (clave) {
          s.icono = clave;
          guardar(); pintar();
        });
      });
      var span = el('span', 'texto', s.texto);
      span.title = 'Doble clic para editar';
      span.addEventListener('dblclick', function () {
        editarEn(span, s.texto, function (v) { s.texto = v; });
      });
      var del = el('button', 'borrar', '×');
      del.type = 'button';
      del.setAttribute('aria-label', 'Borrar subtarea');
      del.addEventListener('click', function () {
        conDeshacer('Subtarea borrada', function () {
          t.subtareas = t.subtareas.filter(function (x) { return x.id !== s.id; });
          sincronizar(t);
        });
        guardar(); pintar();
      });
      li.appendChild(cb); li.appendChild(icoBtn); li.appendChild(span); li.appendChild(del);
      ul.appendChild(li);
    });

    var nueva = el('li', 'nueva-sub');
    var icoNueva = el('button', 'icono-btn' + (iconoNuevaSub[t.id] ? '' : ' vacio'));
    icoNueva.type = 'button';
    pintarIcono(icoNueva, iconoNuevaSub[t.id]);
    icoNueva.addEventListener('click', function (e) {
      e.stopPropagation();
      abrirPicker(icoNueva, iconoNuevaSub[t.id], function (clave) {
        iconoNuevaSub[t.id] = clave;
        foco = { tipo: 'sub', id: t.id };
        pintar();
      });
    });
    nueva.appendChild(icoNueva);
    var inp = el('input');
    inp.type = 'text';
    inp.maxLength = 200;
    inp.placeholder = '+ Añadir subtarea';
    inp.setAttribute('aria-label', 'Nueva subtarea');
    inp.dataset.id = t.id;
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var v = inp.value.trim();
        if (!v) return;
        t.subtareas.push({ id: nuevoId(), texto: v, hecha: false, icono: iconoNuevaSub[t.id] || null });
        delete iconoNuevaSub[t.id];
        sincronizar(t);
        foco = { tipo: 'sub', id: t.id };
        guardar(); pintar();
      } else if (e.key === 'Escape') {
        inp.value = ''; inp.blur();
      }
    });
    nueva.appendChild(inp);
    ul.appendChild(nueva);
    return ul;
  }

  function editarEn(span, valor, aplicar) {
    var inp = el('input', 'editar');
    inp.value = valor;
    inp.maxLength = 200;
    span.replaceWith(inp);
    inp.focus(); inp.select();
    var terminado = false;
    function fin(ok) {
      if (terminado) return; terminado = true;
      var v = inp.value.trim();
      if (ok && v) { aplicar(v); guardar(); }
      pintar();
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') fin(true);
      if (e.key === 'Escape') fin(false);
    });
    inp.addEventListener('blur', function () { fin(true); });
  }

  // ---------- Selector de iconos ----------
  var picker = document.getElementById('picker');
  var rejilla = picker.querySelector('.rejilla');
  var nombrePicker = picker.querySelector('.nombre');
  var alElegir = null;
  var anclaPicker = null;

  Object.keys(ICONOS).forEach(function (clave) {
    var b = el('button', 'opcion');
    b.type = 'button';
    b.dataset.clave = clave;
    b.innerHTML = svg(ICONOS[clave].svg);
    b.style.color = ICONOS[clave].color;
    b.title = ICONOS[clave].nombre;
    b.setAttribute('aria-label', ICONOS[clave].nombre);
    b.addEventListener('mouseenter', function () { nombrePicker.textContent = ICONOS[clave].nombre; });
    b.addEventListener('focus', function () { nombrePicker.textContent = ICONOS[clave].nombre; });
    b.addEventListener('click', function () { elegir(clave); });
    rejilla.appendChild(b);
  });
  picker.querySelector('.quitar').addEventListener('click', function () { elegir(null); });

  function abrirPicker(ancla, actual, callback) {
    if (picker.classList.contains('abierto') && anclaPicker === ancla) { cerrarPicker(); return; }
    alElegir = callback;
    anclaPicker = ancla;
    rejilla.querySelectorAll('.opcion').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.clave === actual ? 'true' : 'false');
    });
    nombrePicker.textContent = actual ? ICONOS[actual].nombre : 'Elige un icono';
    picker.classList.add('abierto');
    // Colocarlo bajo el botón, sin salirse del bloque
    var r = ancla.getBoundingClientRect();
    var w = picker.offsetWidth, h = picker.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var top = r.bottom + 4;
    if (top + h > vh - 4) top = Math.max(4, r.top - h - 4);
    var left = Math.min(Math.max(4, r.left), vw - w - 4);
    picker.style.top = top + 'px';
    picker.style.left = Math.max(4, left) + 'px';
    var primero = rejilla.querySelector('[aria-pressed="true"]') || rejilla.querySelector('.opcion');
    primero.focus();
  }
  function cerrarPicker() {
    picker.classList.remove('abierto');
    alElegir = null;
    anclaPicker = null;
  }
  function elegir(clave) {
    var cb = alElegir;
    cerrarPicker();
    if (cb) cb(clave);
  }
  document.addEventListener('click', function (e) {
    if (picker.classList.contains('abierto') && !picker.contains(e.target) && e.target !== anclaPicker && !(anclaPicker && anclaPicker.contains(e.target))) {
      cerrarPicker();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && picker.classList.contains('abierto')) cerrarPicker();
  });
  lista.addEventListener('scroll', cerrarPicker);

  // ---------- Controles generales ----------
  var botonIconoNueva = document.getElementById('icono-nueva');
  function pintarIconoNueva() {
    pintarIcono(botonIconoNueva, iconoNueva);
    botonIconoNueva.classList.toggle('elegido', !!iconoNueva);
    botonIconoNueva.title = iconoNueva ? ICONOS[iconoNueva].nombre + ' · cambiar icono' : 'Elegir icono';
  }
  botonIconoNueva.addEventListener('click', function (e) {
    e.stopPropagation();
    abrirPicker(botonIconoNueva, iconoNueva, function (clave) {
      iconoNueva = clave;
      pintarIconoNueva();
      document.getElementById('nueva').focus();
    });
  });
  pintarIconoNueva();

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = document.getElementById('nueva');
    var v = inp.value.trim();
    if (!v) return;
    tareas.unshift({ id: nuevoId(), texto: v, hecha: false, creada: Date.now(), abierta: false, icono: iconoNueva, subtareas: [] });
    inp.value = '';
    iconoNueva = null;
    pintarIconoNueva();
    guardar(); pintar();
  });

  document.querySelectorAll('.filtros button').forEach(function (b) {
    b.addEventListener('click', function () {
      filtro = b.dataset.f;
      document.querySelectorAll('.filtros button').forEach(function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      pintar();
    });
  });

  document.getElementById('limpiar').addEventListener('click', function () {
    if (!tareas.some(function (t) { return t.hecha; })) return;
    conDeshacer('Hechas borradas', function () {
      tareas = tareas.filter(function (t) { return !t.hecha; });
    });
    guardar(); pintar();
  });

  if (!cargar()) document.getElementById('aviso').textContent = 'No se puede guardar en este navegador';
  pintar();
})();
</script>
</body>
</html>
