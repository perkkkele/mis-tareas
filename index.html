<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orden del día</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f6f8;
    --border: #e3e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-soft: #e8f0fe;
    --ok: #1f9d55;
    --ok-soft: #e6f6ec;
    --done: #9aa1ad;
    --danger: #d93838;
    --seg: #8b5cf6;
    --seg-soft: #ede9fe;
    --seg-text: #6d28d9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; border: 0; cursor: pointer; background: transparent; color: inherit; }

  /* El título «Mis tareas» lo muestra la barra del bloque de Symbaloo; aquí solo pestañas y contador */
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 6px; }
  .solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  form#form { display: flex; gap: 6px; padding: 8px 12px 4px; border-top: 1px solid var(--border); }
  #nueva {
    flex: 1; min-width: 0; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--surface);
  }
  #nueva:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }
  #anadir { background: var(--accent); color: #fff; padding: 0 12px; font-weight: 600; border-radius: 8px; }
  #anadir:hover { filter: brightness(1.08); }

  .filtros { display: flex; gap: 4px; }
  .filtros button { color: var(--muted); padding: 3px 9px; border-radius: 999px; font-size: 12px; }
  .filtros button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  #lista, .lista-col { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; }
  #lista { flex: 1; }
  #lista[hidden], #columnas[hidden] { display: none; }

  /* Pestaña Pendientes: dos columnas, ToDo y Seguimiento */
  #columnas { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--border); }
  .columna { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; transition: background .15s; }
  .columna + .columna { border-left: 1px solid var(--border); }
  .columna.seg { background: #faf8ff; }
  .col-cab {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .seg .col-dot { background: var(--seg); }
  .col-num { font-weight: 600; letter-spacing: 0; background: var(--surface); border-radius: 999px; padding: 0 7px; }
  .seg .col-num { background: var(--seg-soft); color: var(--seg-text); }
  .lista-col { flex: 1; min-height: 48px; }
  .lista-col:has(> .tarea) > .lista-vacia { display: none; }
  .columna.destino { background: var(--accent-soft); }
  .columna.seg.destino { background: var(--seg-soft); }
  @media (max-width: 520px) {
    #columnas { flex-direction: column; }
    .columna + .columna { border-left: 0; border-top: 1px solid var(--border); }
  }

  /* Seguimiento: motivo y botón de mover */
  /* Título + motivo en la misma línea; el motivo va a la derecha como una píldora */
  .linea-titulo { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
  .linea-titulo .texto { flex: 1 1 auto; min-width: 50%; }
  .motivo {
    margin-left: auto; margin-top: -1px; flex: 0 1 auto; min-width: 0; max-width: 50%;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px 2px 7px; border-radius: 999px;
    background: var(--seg-soft); color: var(--seg-text);
    font: inherit; font-size: 11.5px; font-weight: 500; line-height: 18px;
    box-shadow: inset 0 0 0 1px rgba(109, 40, 217, .14), 0 1px 1px rgba(20, 30, 50, .06);
    cursor: pointer; transition: background .12s, box-shadow .12s;
  }
  .motivo, .motivo-input { transition: margin-right .12s, background .12s, box-shadow .12s; }
  .fila:hover .motivo, .fila:focus-within .motivo, .fila:hover .motivo-input { margin-right: 50px; }
  @media (hover: none) { .fila:hover .motivo, .fila:focus-within .motivo, .fila:hover .motivo-input { margin-right: 0; } }
  .motivo:hover { background: #ddd6fe; box-shadow: inset 0 0 0 1px rgba(109, 40, 217, .28), 0 1px 2px rgba(20, 30, 50, .1); }
  .motivo:focus-visible { outline: 2px solid var(--seg); outline-offset: 1px; }
  .motivo svg { width: 12px; height: 12px; flex: none; }
  .motivo-txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .motivo.sin-motivo {
    background: transparent; color: var(--muted); font-style: italic;
    box-shadow: inset 0 0 0 1px var(--border); border: 0;
  }
  .motivo.sin-motivo:hover { background: var(--seg-soft); color: var(--seg-text); }
  .chip-seg { flex: none; font-weight: 700; }
  .chip-seg::after { content: '·'; margin-left: 5px; font-weight: 400; }
  .motivo.solo-chip .chip-seg::after { content: none; }
  .motivo-input {
    margin-left: auto; margin-top: -2px; flex: 0 1 55%; max-width: 280px; min-width: 0; padding: 3px 10px;
    font: inherit; font-size: 12px; border: 1px solid var(--seg); border-radius: 999px; background: #fff;
  }
  .motivo-input:focus { outline: 2px solid var(--seg-soft); }
  .mover {
    width: 22px; height: 22px; flex: none; border-radius: 6px; padding: 0;
    display: grid; place-items: center; color: var(--muted); opacity: 0;
  }
  .mover svg { width: 14px; height: 14px; display: block; }
  .fila:hover > .mover, .mover:focus { opacity: 1; }
  .mover:hover { background: var(--seg-soft); color: var(--seg-text); }
  @media (hover: none) { .mover { opacity: 1; } }

  /* Fila de tarea */
  .tarea { border-radius: 8px; }
  .tarea.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: var(--ok-soft); } 100% { background: transparent; } }
  .fila > .asa { position: absolute; left: -6px; top: 50%; transform: translateY(-50%); width: 12px; }
  .fila { position: relative; display: flex; align-items: center; gap: 5px; padding: 5px 4px; border-radius: 8px; }
  /* Botones de mover y borrar: flotan sobre el final de la fila al pasar el ratón, sin quitar espacio al título */
  .acciones {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 2px; padding-left: 14px;
    background: linear-gradient(to right, transparent, var(--surface) 14px);
    opacity: 0; pointer-events: none; border-radius: 0 8px 8px 0;
  }
  .fila:hover > .acciones, .acciones:focus-within { opacity: 1; pointer-events: auto; }
  .columna.seg .fila:hover { background: #f1edfd; }
  .columna.seg .acciones { background: linear-gradient(to right, transparent, #f1edfd 14px); }
  .acciones .mover, .acciones .borrar { opacity: 1; }
  @media (hover: none) {
    .acciones { position: static; transform: none; opacity: 1; pointer-events: auto; background: none; padding-left: 0; }
  }
  .fila:hover { background: var(--surface); }
  /* Triángulo de desplegar: macizo y oscuro si hay subtareas, fino y claro si no */
  .expandir {
    width: 18px; height: 18px; flex: none; border-radius: 4px; padding: 0;
    display: grid; place-items: center;
    color: #2b2f38; transition: transform .15s;
  }
  .expandir svg { width: 10px; height: 10px; display: block; }
  .expandir path { fill: currentColor; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; }
  .sin-subs .expandir { color: #b4b9c3; }
  .sin-subs .expandir path { fill: none; stroke-width: 1.3; }
  .expandir:hover { background: var(--border); }
  .sin-subs .expandir:hover { color: var(--muted); }
  .expandir[aria-expanded="true"] { transform: rotate(90deg); }

  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex: none; cursor: pointer; margin: 0; }
  .cuerpo { flex: 1; min-width: 0; }
  .texto { display: block; overflow-wrap: anywhere; cursor: text; }
  .hecha > .fila .texto, .sub.hecha .texto { color: var(--done); text-decoration: line-through; }
  .barra { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s; }
  .hecha .barra i { background: var(--ok); }
  .contador {
    flex: none; font-size: 11px; color: var(--muted);
    background: var(--surface); border-radius: 999px; padding: 1px 7px;
  }
  .hecha .contador { color: var(--ok); background: var(--ok-soft); }

  .editar { width: 100%; font: inherit; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; }

  .borrar {
    width: 22px; height: 22px; flex: none; border-radius: 6px;
    color: var(--muted); font-size: 16px; line-height: 1; opacity: 0;
  }
  .fila:hover > .borrar, .sub:hover > .borrar, .borrar:focus { opacity: 1; }
  .borrar:hover { color: var(--danger); background: #fdecec; }
  @media (hover: none) { .borrar { opacity: 1; } }

  /* Subtareas */
  .subs { list-style: none; margin: 0 0 4px 30px; padding: 0 0 0 10px; border-left: 2px solid var(--border); }
  .sub { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px; font-size: 13px; }
  .sub:hover { background: var(--surface); }
  .sub .texto { flex: 1; min-width: 0; }
  .nueva-sub { padding: 3px 4px; }
  .nueva-sub input {
    flex: 1; min-width: 0; width: 100%; font: inherit; font-size: 13px; padding: 4px 8px;
    border: 1px dashed var(--border); border-radius: 6px; background: transparent;
  }
  .nueva-sub input:focus { outline: none; border-style: solid; border-color: var(--accent); background: #fff; }

  .lista-vacia { color: var(--muted); text-align: center; padding: 18px 10px; font-size: 13px; }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 2px 12px 6px; min-height: 26px;
    font-size: 12px; color: var(--muted);
  }
  #limpiar { color: var(--muted); font-size: 12px; padding: 2px 4px; }
  #limpiar:hover { color: var(--danger); }
  #aviso { color: var(--danger); }
  #deshacer-wrap { display: none; align-items: center; gap: 6px; color: var(--text); }
  #deshacer-wrap.visible { display: flex; }
  #deshacer { color: var(--accent); font-weight: 600; font-size: 12px; padding: 2px 4px; }

  /* Iconos */
  .ico { width: 16px; height: 16px; display: block; }
  .icono-btn {
    width: 22px; height: 22px; flex: none; border-radius: 6px; padding: 0;
    display: grid; place-items: center;
  }
  .icono-btn:hover { background: var(--border); }
  .icono-btn.vacio { color: var(--muted); opacity: 0; }
  .fila:hover .icono-btn.vacio, .sub:hover .icono-btn.vacio, .nueva-sub .icono-btn.vacio, .icono-btn.vacio:focus { opacity: .6; }
  .hecha > .fila .icono-btn:not(.vacio), .sub.hecha .icono-btn:not(.vacio) { opacity: .45; }
  .sub .icono-btn, .nueva-sub .icono-btn { width: 20px; height: 20px; }
  .sub .ico, .nueva-sub .ico { width: 14px; height: 14px; }
  .nueva-sub { display: flex; align-items: center; gap: 6px; }
  @media (hover: none) { .icono-btn.vacio { opacity: .4; } }

  #icono-nueva {
    width: 34px; flex: none; border-radius: 8px; padding: 0;
    border: 1px solid var(--border); background: var(--surface);
    display: grid; place-items: center; color: var(--muted);
  }
  #icono-nueva:hover { border-color: var(--accent); }
  #icono-nueva.elegido { background: #fff; }

  .menu {
    position: fixed; z-index: 10; display: none;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(20, 30, 50, .16);
    padding: 6px;
  }
  .menu.abierto { display: block; }
  #picker { width: 172px; }
  #picker .rejilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #picker .opcion {
    height: 36px; border-radius: 8px; display: grid; place-items: center;
  }
  #picker .opcion:hover, #picker .opcion:focus { background: var(--surface); outline: none; }
  #picker .opcion[aria-pressed="true"] { background: var(--accent-soft); }
  #picker .opcion .ico { width: 18px; height: 18px; }
  #picker .nombre { font-size: 11px; color: var(--muted); text-align: center; height: 16px; margin-top: 4px; }
  .menu .quitar {
    width: 100%; margin-top: 4px; padding: 4px; border-radius: 6px;
    font-size: 12px; color: var(--muted);
  }
  .menu .quitar:hover { background: #fdecec; color: var(--danger); }

  /* Arrastrar y soltar */
  .asa {
    width: 14px; height: 22px; flex: none; padding: 0; border-radius: 4px;
    display: grid; place-items: center; color: var(--muted);
    cursor: grab; touch-action: none; opacity: 0;
  }
  .asa svg { width: 10px; height: 14px; display: block; }
  .fila:hover > .asa, .sub:hover > .asa, .asa:focus { opacity: .7; }
  .asa:hover { background: var(--border); opacity: 1; }
  .asa:focus-visible { outline: 2px solid var(--accent); opacity: 1; }
  .sub .asa { height: 20px; }
  @media (hover: none) { .asa { opacity: .5; } }
  body.arrastrando, body.arrastrando * { cursor: grabbing !important; user-select: none; }
  .arrastrando-item {
    position: relative; z-index: 2; background: #fff;
    box-shadow: 0 6px 18px rgba(20, 30, 50, .18); border-radius: 8px;
  }
  .arrastrando-item .asa { opacity: 1; }

  /* Importancia (semáforo) */
  .punto {
    display: block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--c, transparent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c, transparent) 22%, transparent);
  }
  .prio-btn {
    width: 18px; height: 22px; flex: none; border-radius: 6px; padding: 0;
    display: grid; place-items: center;
  }
  .prio-btn:hover { background: var(--border); }
  .prio-btn.vacio .punto { background: transparent; box-shadow: none; border: 1.5px dashed var(--muted); width: 9px; height: 9px; }
  .prio-btn.vacio { opacity: 0; }
  .fila:hover .prio-btn.vacio, .sub:hover .prio-btn.vacio, .nueva-sub .prio-btn.vacio, .prio-btn.vacio:focus { opacity: .6; }
  .hecha > .fila .prio-btn:not(.vacio), .sub.hecha .prio-btn:not(.vacio) { opacity: .45; }
  .sub .prio-btn, .nueva-sub .prio-btn { width: 16px; height: 20px; }
  .sub .punto, .nueva-sub .punto { width: 8px; height: 8px; }
  .sub .prio-btn.vacio .punto, .nueva-sub .prio-btn.vacio .punto { width: 7px; height: 7px; }
  @media (hover: none) { .prio-btn.vacio { opacity: .4; } }

  #prio-nueva {
    width: 26px; flex: none; border-radius: 8px; padding: 0;
    border: 1px solid var(--border); background: var(--surface);
    display: grid; place-items: center;
  }
  #prio-nueva:hover { border-color: var(--accent); }
  #prio-nueva.elegido { background: #fff; }
  #prio-nueva.vacio .punto { background: transparent; box-shadow: none; border: 1.5px dashed var(--muted); }

  #menu-prio { width: 150px; }
  #menu-prio .opcion {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; font-size: 13px; text-align: left;
  }
  #menu-prio .opcion:hover, #menu-prio .opcion:focus { background: var(--surface); outline: none; }
  #menu-prio .opcion[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1 class="solo-lector">Orden del día</h1>
    <div class="filtros" role="group" aria-label="Filtro">
      <button data-f="todas" aria-pressed="false">Todas</button>
      <button data-f="pendientes" aria-pressed="true">Pendientes</button>
      <button data-f="hechas" aria-pressed="false">Hechas</button>
    </div>
    <span id="count"></span>
  </header>

  <ul id="lista" hidden></ul>

  <div id="columnas">
    <section class="columna" data-estado="todo" aria-label="To-Do">
      <div class="col-cab"><span class="col-dot"></span>To-Do <span class="col-num"></span></div>
      <ul class="lista-col" data-estado="todo"></ul>
    </section>
    <section class="columna seg" data-estado="seguimiento" aria-label="Seguimiento">
      <div class="col-cab"><span class="col-dot"></span>Seguimiento <span class="col-num"></span></div>
      <ul class="lista-col" data-estado="seguimiento"></ul>
    </section>
  </div>

  <form id="form" autocomplete="off">
    <button id="prio-nueva" type="button" title="Elegir importancia" aria-label="Elegir importancia para la nueva tarea"></button>
    <button id="icono-nueva" type="button" title="Elegir icono" aria-label="Elegir icono para la nueva tarea"></button>
    <input id="nueva" type="text" placeholder="Nueva tarea y pulsa Enter" maxlength="200" aria-label="Nueva tarea">
    <button id="anadir" type="submit" aria-label="Añadir tarea">+</button>
  </form>

  <footer>
    <span id="aviso"></span>
    <span id="deshacer-wrap"><span id="deshacer-msg"></span><button id="deshacer" type="button">Deshacer</button></span>
    <button id="limpiar" type="button">Borrar hechas</button>
  </footer>

  <div id="menu-prio" class="menu" role="dialog" aria-label="Elegir importancia"></div>

  <div id="picker" class="menu" role="dialog" aria-label="Elegir icono">
    <div class="rejilla"></div>
    <div class="nombre"></div>
    <button class="quitar" type="button">Sin icono</button>
  </div>

<script>
(function () {
  var CLAVE = 'mis-tareas-v1';
  var tareas = [];
  var filtro = 'pendientes';     // pestaña por defecto
  var editandoMotivo = null;    // id de la tarea cuyo motivo de seguimiento se está escribiendo
  var foco = null;          // { tipo: 'sub', id } para recolocar el foco tras repintar
  var flashId = null;       // tarea que acaba de completarse sola
  var copiaDeshacer = null;
  var temporizador = null;
  var iconoNueva = null;    // icono elegido para la próxima tarea
  var iconoNuevaSub = {};   // icono elegido para la próxima subtarea, por tarea
  var prioNueva = null;     // importancia elegida para la próxima tarea
  var prioNuevaSub = {};    // importancia elegida para la próxima subtarea, por tarea

  // ---------- Importancia (semáforo) ----------
  var PRIORIDADES = {
    alta:  { nombre: 'Alta',  color: '#dc2626' },
    media: { nombre: 'Media', color: '#f59e0b' },
    baja:  { nombre: 'Baja',  color: '#16a34a' }
  };
  function pintarBadge(boton, clave) {
    var pr = PRIORIDADES[clave];
    boton.innerHTML = '<span class="punto"></span>';
    if (pr) boton.firstChild.style.setProperty('--c', pr.color);
    boton.classList.toggle('vacio', !pr);
    boton.title = pr ? 'Importancia ' + pr.nombre.toLowerCase() + ' · cambiar' : 'Poner importancia';
    boton.setAttribute('aria-label', boton.title);
  }

  // ---------- Iconos ----------
  var ICONOS = {
    llamar:    { nombre: 'Llamar',    color: '#1f9d55', svg: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>' },
    ordenador: { nombre: 'Ordenador', color: '#4b5563', svg: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>' },
    casa:      { nombre: 'Casa',      color: '#d97706', svg: '<path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>' },
    email:     { nombre: 'Email',     color: '#2f6fed', svg: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>' },
    comprar:   { nombre: 'Comprar',   color: '#db2777', svg: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>' },
    reunion:   { nombre: 'Reunión',   color: '#7c3aed', svg: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>' },

  var ICONO_VACIO = '<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><path d="M12 8.5v7M8.5 12h7"/>';

  // ---------- Datos ----------

        abierta: !!t.abierta,
        icono: ICONOS[t.icono] ? t.icono : null,

  function sincronizar(t) {

  // ---------- Deshacer ----------

    wrap.classList.add('visible');
    document.getElementById('limpiar').style.display = 'none';

  // ---------- Pintado ----------
  var lista = document.getElementById('lista');

  var columnas = document.getElementById('columnas');

  var colSeg = columnas.querySelector('.lista-col[data-estado="seguimiento"]');

  // Contenedores de tareas visibles ahora mismo (dos columnas en Pendientes, una lista en el resto)
  function zonas() { return filtro === 'pendientes' ? [colTodo, colSeg] : [lista]; }
  function idsEn(zona) {
    return Array.prototype.map.call(zona.querySelectorAll(':scope > .tarea'), function (n) { return n.dataset.id; });
  }

  var pintando = false;
  function pintar() {
    pintando = true;
    try { pintarTodo(); } finally { pintando = false; }
    if (editandoMotivo) {
      var mi = document.querySelector('.tarea[data-id="' + editandoMotivo + '"] .motivo-input');
      if (mi) { mi.focus(); mi.setSelectionRange(mi.value.length, mi.value.length); }
    } else if (foco && foco.tipo === 'sub') {
      var inp = document.querySelector('.nueva-sub input[data-id="' + foco.id + '"]');
      if (inp) inp.focus();
    } else if (foco && foco.tipo === 'asa') {
      var asa = document.querySelector('[data-id="' + foco.id + '"] > .fila > .asa, [data-id="' + foco.id + '"].sub > .asa');

  }

  function pintarTodo() {
    var enColumnas = filtro === 'pendientes';
    lista.hidden = enColumnas;
    columnas.hidden = !enColumnas;
    lista.innerHTML = ''; colTodo.innerHTML = ''; colSeg.innerHTML = '';

    if (enColumnas) {
      var pendientes = tareas.filter(function (t) { return !t.hecha; });
      var todo = pendientes.filter(function (t) { return t.estado !== 'seguimiento'; });
      var seg = pendientes.filter(function (t) { return t.estado === 'seguimiento'; });
      // El aviso de columna vacía se oculta solo (CSS) en cuanto hay alguna tarea dentro
      colTodo.appendChild(el('li', 'lista-vacia', tareas.length ? 'Nada por hacer' : 'Sin tareas. Escribe una arriba.'));
      colSeg.appendChild(el('li', 'lista-vacia', 'Arrastra aquí lo que esté a la espera'));
      todo.forEach(function (t) { colTodo.appendChild(pintarTarea(t)); });
      seg.forEach(function (t) { colSeg.appendChild(pintarTarea(t)); });
      colTodo.parentNode.querySelector('.col-num').textContent = todo.length;
      colSeg.parentNode.querySelector('.col-num').textContent = seg.length;
    } else {
      var visibles = tareas.filter(function (t) { return filtro === 'todas' || t.hecha; });
      if (!visibles.length) {
        lista.appendChild(el('li', 'lista-vacia', tareas.length ? 'Nada en este filtro' : 'Sin tareas. Escribe una arriba.'));
      }
      visibles.forEach(function (t) { lista.appendChild(pintarTarea(t)); });

  // Pasar una tarea entre ToDo y Seguimiento
  function cambiarEstado(t, nuevo) {
    if (t.estado === nuevo) return;
    t.estado = nuevo;

      editandoMotivo = t.id;     // pedir el motivo nada más moverla
    } else {

      if (editandoMotivo === t.id) editandoMotivo = null;

  var RELOJ_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var FLECHA_DER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var FLECHA_IZQ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';

  function pintarMotivo(t, contenedor) {
    if (editandoMotivo === t.id) {
      var inp = el('input', 'motivo-input');
      inp.type = 'text';
      inp.maxLength = 200;
      inp.value = t.motivo;
      inp.placeholder = 'Motivo del seguimiento…';

      inp.setAttribute('aria-label', 'Motivo del seguimiento');
      var hecho = false;
      function fin(guardarlo) {

        editandoMotivo = null;
        guardar(); pintar();
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); fin(true); }

      inp.addEventListener('blur', function () { fin(true); });
      contenedor.appendChild(inp);
      return;
    }
    var enTodas = filtro !== 'pendientes';
    var m = el('button', 'motivo' + (t.motivo || enTodas ? '' : ' sin-motivo') + (enTodas && !t.motivo ? ' solo-chip' : ''));
    m.type = 'button';
    m.title = t.motivo ? 'Motivo: ' + t.motivo + ' · clic para cambiarlo' : 'Clic para escribir el motivo del seguimiento';
    var ic = el('span');
    ic.innerHTML = RELOJ_SVG;
    m.appendChild(ic.firstChild);
    if (enTodas) m.appendChild(el('span', 'chip-seg', 'Seguimiento'));
    if (t.motivo || !enTodas) m.appendChild(el('span', 'motivo-txt', t.motivo || 'Motivo'));
    m.addEventListener('click', function () { editandoMotivo = t.id; pintar(); });
    contenedor.appendChild(m);
  }

  function pintarTarea(t) {
    var total = t.subtareas.length;
    var hechas = t.subtareas.filter(function (s) { return s.hecha; }).length;

    var li = el('li', 'tarea' + (t.hecha ? ' hecha' : '') + (total ? '' : ' sin-subs') + (flashId === t.id ? ' flash' : ''));

    var exp = el('button', 'expandir');
    exp.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 1.2 L8.6 5 L2.5 8.8 Z"/></svg>';

    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = t.hecha;

  function pintarSubtareas(t) {
    var ul = el('ul', 'subs');
    t.subtareas.forEach(function (s) {

      icoBtn.type = 'button';
      pintarIcono(icoBtn, s.icono);
      icoBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        abrirPicker(icoBtn, s.icono, function (clave) {

          guardar(); pintar();

  function editarEn(span, valor, aplicar) {
    var inp = el('input', 'editar');
    inp.value = valor;
    inp.maxLength = 200;
    span.replaceWith(inp);
    inp.focus(); inp.select();
    var terminado = false;
    function fin(ok) {
      if (terminado) return; terminado = true;
      var v = inp.value.trim();
      if (ok && v) { aplicar(v); guardar(); }
      pintar();
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') fin(true);
      if (e.key === 'Escape') fin(false);
    });
    inp.addEventListener('blur', function () { fin(true); });
  }

  // ---------- Arrastrar y soltar ----------
  var ASA_SVG = '<svg viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></svg>';

  function crearAsa(tipo, id, padre) {
    var b = el('button', 'asa');
    b.type = 'button';
    b.innerHTML = ASA_SVG;
    b.title = tipo === 'tarea' ? 'Arrastra para mover (flechas ↑ ↓ para ordenar, ← → para cambiar de columna)' : 'Arrastra para mover (o usa las flechas ↑ ↓)';
    b.setAttribute('aria-label', tipo === 'tarea' ? 'Mover tarea' : 'Mover subtarea');
    b.addEventListener('pointerdown', function (e) { empezarArrastre(e, b, tipo, padre); });
    b.addEventListener('keydown', function (e) {
      if (tipo === 'tarea' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        var t = buscar(id);
        if (!t || t.hecha) return;
        e.preventDefault();
        cambiarEstado(t, e.key === 'ArrowRight' ? 'seguimiento' : 'todo');
        if (t.estado === 'todo') foco = { tipo: 'asa', id: id };
        guardar(); pintar();
        return;
      }
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      moverConTeclado(tipo, id, padre, e.key === 'ArrowUp' ? -1 : 1);
    });
    return b;
  }

  // Hermanos entre los que se puede soltar
  function hermanos(contenedor, tipo, excepto) {
    var sel = tipo === 'tarea' ? ':scope > .tarea' : ':scope > .sub';
    return Array.prototype.filter.call(contenedor.querySelectorAll(sel), function (n) { return n !== excepto; });
  }

  var arrastre = null;
  function empezarArrastre(e, asa, tipo, padre) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    cerrarMenu();
    var item = asa.closest(tipo === 'tarea' ? '.tarea' : '.sub');
    var contenedor = item.parentNode;
    arrastre = {
      tipo: tipo, padre: padre, item: item, contenedor: contenedor, origen: contenedor, asa: asa,
      inicioX: e.clientX, inicioY: e.clientY, x: e.clientX, y: e.clientY,
      movido: false, raf: null, puntero: e.pointerId,
      entreColumnas: tipo === 'tarea' && filtro === 'pendientes',
      ordenInicial: firmaOrden(tipo, contenedor)
    };
    capturar();
    // Escuchamos en el documento: al mover el elemento en el DOM se pierde la captura del puntero
    document.addEventListener('pointermove', moverArrastre);
    document.addEventListener('pointerup', soltarArrastre);
    document.addEventListener('pointercancel', cancelarArrastre);
    window.addEventListener('blur', soltarArrastre);
  }
  function firmaOrden(tipo, contenedor) {
    if (tipo === 'tarea') return zonas().map(idsEn).map(function (l) { return l.join(','); }).join('|');
    return hermanos(contenedor, tipo, null).map(function (n) { return n.dataset.id; }).join(',');
  }
  function zonaConScroll() {
    return arrastre.tipo === 'tarea' ? arrastre.contenedor : arrastre.item.closest('#lista, .lista-col');
  }
  // Columna (ToDo o Seguimiento) que hay bajo el puntero
  function columnaEn(x, y) {
    var cols = columnas.querySelectorAll('.columna');
    for (var i = 0; i < cols.length; i++) {
      var r = cols[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cols[i].querySelector('.lista-col');
    }
    return null;
  }
  function capturar() {
    try { arrastre.asa.setPointerCapture(arrastre.puntero); } catch (err) {}
  }

  function moverArrastre(e) {
    if (!arrastre || e.pointerId !== arrastre.puntero) return;
    arrastre.x = e.clientX;
    arrastre.y = e.clientY;
    if (!arrastre.movido) {
      if (Math.abs(e.clientY - arrastre.inicioY) < 4 && Math.abs(e.clientX - arrastre.inicioX) < 4) return;
      arrastre.movido = true;
      arrastre.item.classList.add('arrastrando-item');
      document.body.classList.add('arrastrando');
      autoScroll();
    }
    recolocar();
  }

  function recolocar() {
    var a = arrastre;
    if (a.entreColumnas) {
      var destino = columnaEn(a.x, a.y);
      if (destino && destino !== a.contenedor) a.contenedor = destino;
      columnas.querySelectorAll('.columna').forEach(function (c) {
        c.classList.toggle('destino', a.contenedor !== a.origen && c.contains(a.contenedor));
      });
    }
    var otros = hermanos(a.contenedor, a.tipo, a.item);
    var antesDe = null;
    for (var i = 0; i < otros.length; i++) {
      var r = otros[i].getBoundingClientRect();
      // Para tareas con subtareas abiertas, usar solo la fila principal como referencia
      var ref = a.tipo === 'tarea' ? otros[i].querySelector(':scope > .fila').getBoundingClientRect() : r;
      if (a.y < ref.top + ref.height / 2) { antesDe = otros[i]; break; }
    }
    if (!antesDe && a.tipo === 'sub') antesDe = a.contenedor.querySelector(':scope > .nueva-sub');
    var movido = false;
    if (antesDe) {
      if (a.item.nextSibling !== antesDe) { a.contenedor.insertBefore(a.item, antesDe); movido = true; }
    } else if (a.contenedor.lastElementChild !== a.item) {
      a.contenedor.appendChild(a.item); movido = true;
    }
    if (movido) capturar();   // recuperar la captura para seguir recibiendo el puntero fuera del bloque
  }

  // Desplazar la lista si arrastras cerca del borde superior o inferior
  function autoScroll() {
    if (!arrastre) return;
    var zona = zonaConScroll();
    var r = zona.getBoundingClientRect();
    var margen = 28, paso = 0;
    if (arrastre.y < r.top + margen) paso = -Math.ceil((r.top + margen - arrastre.y) / 4);
    else if (arrastre.y > r.bottom - margen) paso = Math.ceil((arrastre.y - (r.bottom - margen)) / 4);
    if (paso) { zona.scrollTop += paso; recolocar(); }
    arrastre.raf = requestAnimationFrame(autoScroll);
  }

  function terminarArrastre() {
    var a = arrastre;
    arrastre = null;
    if (a.raf) cancelAnimationFrame(a.raf);
    document.removeEventListener('pointermove', moverArrastre);
    document.removeEventListener('pointerup', soltarArrastre);
    document.removeEventListener('pointercancel', cancelarArrastre);
    window.removeEventListener('blur', soltarArrastre);
    try { a.asa.releasePointerCapture(a.puntero); } catch (err) {}
    a.item.classList.remove('arrastrando-item');
    document.body.classList.remove('arrastrando');
    columnas.querySelectorAll('.columna.destino').forEach(function (c) { c.classList.remove('destino'); });
    return a;
  }

  function soltarArrastre() {
    if (!arrastre) return;
    var a = terminarArrastre();
    if (!a.movido) return;
    if (firmaOrden(a.tipo, a.contenedor) === a.ordenInicial) return;
    if (a.tipo === 'tarea') {
      if (a.entreColumnas) {
        // La columna donde se suelta decide el estado
        idsEn(colTodo).forEach(function (id) { cambiarEstado(buscar(id), 'todo'); });
        idsEn(colSeg).forEach(function (id) { cambiarEstado(buscar(id), 'seguimiento'); });
      }
      aplicarOrdenTareas([].concat.apply([], zonas().map(idsEn)));
    } else {
      aplicarOrdenSubtareas(a.padre, hermanos(a.contenedor, a.tipo, null).map(function (n) { return n.dataset.id; }));
    }
    guardar(); pintar();
  }

  function cancelarArrastre() {
    if (!arrastre) return;
    terminarArrastre();
    pintar();
  }

  // Con un filtro activo solo se reordenan las tareas visibles: ocupan los mismos huecos que tenían.
  function aplicarOrdenTareas(ordenVisible) {
    var porId = {};
    tareas.forEach(function (t) { porId[t.id] = t; });
    var huecos = [];
    tareas.forEach(function (t, i) { if (ordenVisible.indexOf(t.id) !== -1) huecos.push(i); });
    var nuevas = tareas.slice();
    huecos.forEach(function (pos, i) { nuevas[pos] = porId[ordenVisible[i]]; });
    tareas = nuevas;
  }
  function aplicarOrdenSubtareas(t, orden) {
    var porId = {};
    t.subtareas.forEach(function (s) { porId[s.id] = s; });
    t.subtareas = orden.map(function (id) { return porId[id]; }).filter(Boolean);
  }

  function moverConTeclado(tipo, id, padre, dir) {
    if (tipo === 'tarea') {
      var nodo = document.querySelector('.tarea[data-id="' + id + '"]');
      if (!nodo) return;
      var cont = nodo.parentNode;
      var visibles = idsEn(cont);
      var i = visibles.indexOf(id), j = i + dir;
      if (i < 0 || j < 0 || j >= visibles.length) return;
      visibles.splice(i, 1); visibles.splice(j, 0, id);
      aplicarOrdenTareas([].concat.apply([], zonas().map(function (z) { return z === cont ? visibles : idsEn(z); })));
    } else {
      var orden = padre.subtareas.map(function (s) { return s.id; });
      var k = orden.indexOf(id), m = k + dir;
      if (k < 0 || m < 0 || m >= orden.length) return;
      orden.splice(k, 1); orden.splice(m, 0, id);
      aplicarOrdenSubtareas(padre, orden);
    }
    foco = { tipo: 'asa', id: id };
    guardar(); pintar();
  }

  // ---------- Selector de iconos ----------
  var picker = document.getElementById('picker');
  var rejilla = picker.querySelector('.rejilla');
  var nombrePicker = picker.querySelector('.nombre');

  Object.keys(ICONOS).forEach(function (clave) {
    var b = el('button', 'opcion');
    b.type = 'button';
    b.dataset.clave = clave;
    b.innerHTML = svg(ICONOS[clave].svg);
    b.style.color = ICONOS[clave].color;
    b.title = ICONOS[clave].nombre;
    b.setAttribute('aria-label', ICONOS[clave].nombre);
    b.addEventListener('mouseenter', function () { nombrePicker.textContent = ICONOS[clave].nombre; });
    b.addEventListener('focus', function () { nombrePicker.textContent = ICONOS[clave].nombre; });
    b.addEventListener('click', function () { elegir(clave); });
    rejilla.appendChild(b);
  });
  picker.querySelector('.quitar').addEventListener('click', function () { elegir(null); });

  // Menú de importancia
  var menuPrio = document.getElementById('menu-prio');
  Object.keys(PRIORIDADES).forEach(function (clave) {
    var b = el('button', 'opcion');
    b.type = 'button';
    b.dataset.clave = clave;
    var p = el('span', 'punto');
    p.style.setProperty('--c', PRIORIDADES[clave].color);
    b.appendChild(p);
    b.appendChild(document.createTextNode(PRIORIDADES[clave].nombre));
    b.addEventListener('click', function () { elegir(clave); });
    menuPrio.appendChild(b);
  });
  var quitarPrio = el('button', 'quitar', 'Sin importancia');
  quitarPrio.type = 'button';
  quitarPrio.addEventListener('click', function () { elegir(null); });
  menuPrio.appendChild(quitarPrio);

  // Lógica común de los menús emergentes
  var menuAbierto = null;   // { el, ancla, cb }
  function abrirMenu(menu, ancla, actual, callback) {
    if (menuAbierto && menuAbierto.ancla === ancla) { cerrarMenu(); return; }
    cerrarMenu();
    menuAbierto = { el: menu, ancla: ancla, cb: callback };
    menu.querySelectorAll('.opcion').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.clave === actual ? 'true' : 'false');
    });
    menu.classList.add('abierto');
    // Colocarlo bajo el botón, sin salirse del bloque
    var r = ancla.getBoundingClientRect();
    var w = menu.offsetWidth, h = menu.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var top = r.bottom + 4;
    if (top + h > vh - 4) top = Math.max(4, r.top - h - 4);
    var left = Math.min(Math.max(4, r.left), vw - w - 4);
    menu.style.top = top + 'px';
    menu.style.left = Math.max(4, left) + 'px';
    var primero = menu.querySelector('.opcion[aria-pressed="true"]') || menu.querySelector('.opcion');
    if (primero) primero.focus();
  }
  function cerrarMenu() {
    if (!menuAbierto) return;
    menuAbierto.el.classList.remove('abierto');
    menuAbierto = null;
  }
  function elegir(clave) {
    var cb = menuAbierto && menuAbierto.cb;
    cerrarMenu();
    if (cb) cb(clave);
  }
  function abrirPicker(ancla, actual, callback) {
    nombrePicker.textContent = actual ? ICONOS[actual].nombre : 'Elige un icono';
    abrirMenu(picker, ancla, actual, callback);
  }
  function abrirPrio(ancla, actual, callback) {
    abrirMenu(menuPrio, ancla, actual, callback);
  }
  document.addEventListener('click', function (e) {
    if (menuAbierto && !menuAbierto.el.contains(e.target) && !menuAbierto.ancla.contains(e.target)) cerrarMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menuAbierto) cerrarMenu();
  });
  [lista, colTodo, colSeg].forEach(function (z) { z.addEventListener('scroll', cerrarMenu); });

  // ---------- Controles generales ----------
  var botonIconoNueva = document.getElementById('icono-nueva');
  function pintarIconoNueva() {
    pintarIcono(botonIconoNueva, iconoNueva);
    botonIconoNueva.classList.toggle('elegido', !!iconoNueva);
    botonIconoNueva.title = iconoNueva ? ICONOS[iconoNueva].nombre + ' · cambiar icono' : 'Elegir icono';
  }
  botonIconoNueva.addEventListener('click', function (e) {
    e.stopPropagation();
    abrirPicker(botonIconoNueva, iconoNueva, function (clave) {
      iconoNueva = clave;
      pintarIconoNueva();
      document.getElementById('nueva').focus();
    });
  });
  pintarIconoNueva();

  var botonPrioNueva = document.getElementById('prio-nueva');
  function pintarPrioNueva() {
    pintarBadge(botonPrioNueva, prioNueva);
    botonPrioNueva.classList.toggle('elegido', !!prioNueva);
  }
  botonPrioNueva.addEventListener('click', function (e) {
    e.stopPropagation();
    abrirPrio(botonPrioNueva, prioNueva, function (clave) {
      prioNueva = clave;
      pintarPrioNueva();
      document.getElementById('nueva').focus();
    });
  });
  pintarPrioNueva();

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = document.getElementById('nueva');
    var v = inp.value.trim();
    if (!v) return;
    tareas.unshift({ id: nuevoId(), texto: v, hecha: false, creada: Date.now(), abierta: false, icono: iconoNueva, prioridad: prioNueva, estado: 'todo', motivo: '', subtareas: [] });
    inp.value = '';
    iconoNueva = null;
    prioNueva = null;
    pintarIconoNueva();
    pintarPrioNueva();
    guardar(); pintar();
  });

  document.querySelectorAll('.filtros button').forEach(function (b) {
    b.addEventListener('click', function () {
      filtro = b.dataset.f;
      document.querySelectorAll('.filtros button').forEach(function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      pintar();
    });
  });

  document.getElementById('limpiar').addEventListener('click', function () {
    if (!tareas.some(function (t) { return t.hecha; })) return;
    conDeshacer('Hechas borradas', function () {
      tareas = tareas.filter(function (t) { return !t.hecha; });
    });
    guardar(); pintar();
  });

  if (!cargar()) document.getElementById('aviso').textContent = 'No se puede guardar en este navegador';
  pintar();
})();
</script>
</body>
</html>
